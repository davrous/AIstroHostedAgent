[project]
name = "zodiaque-tropical"
version = "0.1.0"
description = "AIstro: date-driven astronomical scenes and a Foundry hosted agent."
requires-python = ">=3.11"
dependencies = [
    "agent-framework-core==1.12.1",
    "agent-framework-foundry==1.10.3",
    "agent-framework-foundry-hosting==1.0.0b260722",
    "astropy>=7",
    "azure-ai-agentserver-activity==1.0.0b1",
    "azure-ai-agentserver-core==2.0.0b9",
    "azure-ai-agentserver-invocations==1.0.0b7",
    "azure-ai-agentserver-responses==1.0.0b9",
    "azure-identity>=1.25.3",
    "azure-storage-blob>=12.28",
    "debugpy>=1.8",
    "matplotlib>=3.9",
    "microsoft-agents-activity",
    "microsoft-agents-authentication-msal",
    "microsoft-agents-hosting-core",
    "aiohttp>=3.9",
    "numpy>=2",
    "python-dotenv>=1.2",
    "truststore>=0.10",
]

[dependency-groups]
dev = [
    "ipykernel",
    "ipywidgets",
    "pytest",
    "ruff",
    "skyfield",
    "tqdm",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "approved"
url = "https://packagefeedproxy.microsoft.io/pypi/simple"
default = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
