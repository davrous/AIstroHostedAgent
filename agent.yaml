# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/AgentSchema/refs/heads/main/schemas/v1.0/ContainerAgent.yaml
kind: hosted
name: aistro-agent
description: >
  Date-driven astronomical visualizations using NASA/JPL Horizons, Astropy
  and Babylon.js, available through a custom web chat and Teams HTML Widgets.
protocols:
  - protocol: responses
    version: 2.0.0
  - protocol: activity
    version: 2.0.0
environment_variables:
  - name: PROJECT_ENDPOINT
    value: "https://davrousfoundry.services.ai.azure.com/api/projects/proj-dav"
  - name: MODEL_DEPLOYMENT_NAME
    value: "gpt-5.4-mini"
  - name: ARTIFACT_STORAGE
    value: blob
  - name: AZURE_STORAGE_ACCOUNT_NAME
    value: "staistrob4e7de1847"
  - name: AZURE_STORAGE_CONTAINER_NAME
    value: aistro
  - name: ENABLE_ACTIVITY
    value: "true"
  - name: TEAMS_WIDGET_ASSET_BASE_URL
    value: "https://brave-hill-09694fc0f.3.azurestaticapps.net/teams-widget/v1"
dockerfile_path: Dockerfile
resources:
  cpu: "2.0"
  memory: 4.0Gi
